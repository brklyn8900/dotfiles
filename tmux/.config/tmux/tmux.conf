set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# status bar
set -g status-style bg=default,fg='#6c7086'
set -g status-left ""
set -g status-right "#[fg=#7fa8b9]#S"

# window buttons
# set -g window-status-format "●"
# set -g window-status-current-format "●"
set -g window-status-format " #W "
set -g window-status-current-format " #W"

set -g window-status-current-style \
      "#{?window_zoomed_flag,fg=#d4c9ab,fg=#b0a2c4,nobold}"

set -g window-status-bell-style "fg=#c4929f,nobold"

set -g renumber-windows on

# pane navigation (Opt+hjkl — Ctrl+hjkl is used by Ghostty splits)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# pane separators
set -g pane-border-lines simple
set -g pane-border-style fg='#45475a'
set -g pane-active-border-style fg='#6c7086'

set -g escape-time 0
set -g repeat-time 1000
set -g history-limit 10000

unbind C-b
set -g prefix '`'
bind-key '`' send-prefix

unbind %
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

# popup cheatsheet
bind ? display-popup -E -w 50% -h 80% "cat ~/.config/tmux/cheatsheet.txt && read"

# popup shell in current directory
bind S display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# popup lazygit
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# sessionizer: fuzzy-jump to project session
bind f run-shell "tmux-sessionizer"

set -g mouse on

# Mouse scroll behavior:
# - alternate screen (vim, claude, etc): pass wheel events to the app
# - normal pane: scroll history; auto-exit copy mode when reaching bottom
bind -n WheelUpPane \
  if-shell -F '#{alternate_on}' \
    'send-keys -M' \
    'if-shell -F "#{pane_in_mode}" "send-keys -M" "copy-mode -e"'
bind -n WheelDownPane \
  if-shell -F '#{alternate_on}' \
    'send-keys -M' \
    'if-shell -F "#{pane_in_mode}" "send-keys -M" ""'
bind -T copy-mode-vi WheelUpPane   send -X scroll-up
bind -T copy-mode-vi WheelDownPane send -X scroll-down

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

run '~/.config/tmux/plugins/tpm/tpm'
